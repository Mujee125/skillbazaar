services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: skillbazaar
      POSTGRES_USER: sb
      POSTGRES_PASSWORD: sb_dev_only   # local development only
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sb -d skillbazaar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: