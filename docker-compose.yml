services:
  db:
    image: postgis/postgis:18-3.7
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: skillbazaar
      POSTGRES_USER: sb
      POSTGRES_PASSWORD: sb_dev_only   # local development only
    ports:
      - "5433:5432"
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sb -d skillbazaar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata18:
